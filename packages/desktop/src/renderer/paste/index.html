<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>FlashRead</title>
    <link rel="stylesheet" href="./paste.css" />
  </head>
  <body>
    <div id="tabs">
      <button class="tab-btn active" id="tab-btn-new" data-tab="new">Nuevo texto</button>
      <button class="tab-btn" id="tab-btn-library" data-tab="library">Biblioteca</button>
      <button class="tab-btn" id="tab-btn-history" data-tab="history">Historial</button>
    </div>

    <div id="tab-new" class="tab-panel active">
      <div id="dropzone">
        <p id="dropzone-label">Arrastrá un archivo .txt, .pdf, .docx o .epub acá, o pegá texto abajo</p>
        <textarea id="text-input" placeholder="Pegá o escribí el texto a leer…"></textarea>
        <p id="file-status"></p>
        <div class="actions">
          <label class="checkbox-inline">
            <input type="checkbox" id="save-to-library" />
            Guardar en biblioteca
          </label>
          <button id="btn-read">Leer (Ctrl+Enter)</button>
        </div>
      </div>
    </div>

    <div id="tab-library" class="tab-panel">
      <p id="library-empty" class="empty-hint">Todavía no guardaste nada en tu biblioteca.</p>
      <ul id="library-list" class="item-list"></ul>
    </div>

    <div id="tab-history" class="tab-panel">
      <div class="list-header">
        <span class="list-header-label">Todo lo que leíste, ordenado por fecha</span>
        <button id="btn-clear-history">Vaciar historial</button>
      </div>
      <p id="history-empty" class="empty-hint">Todavía no leíste nada.</p>
      <ul id="history-list" class="item-list"></ul>
    </div>

    <script src="./paste.js"></script>
  </body>
</html>
