<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>FlashRead</title>
    <link rel="stylesheet" href="./reader.css" />
  </head>
  <body>
    <div id="app">
      <div id="layout">
        <div id="reader-main">
          <div id="window-controls">
            <button id="btn-window-minimize" title="Minimizar">─</button>
            <button id="btn-window-close" title="Cerrar">✕</button>
          </div>

          <div id="word-stage">
            <div id="orp-guide-top"></div>
            <div id="word-display">
              <span id="word-pre"></span><span id="word-orp"></span><span id="word-post"></span>
            </div>
            <div id="orp-guide-bottom"></div>
          </div>

          <div id="progress-bar"><div id="progress-fill"></div></div>

          <div id="controls" class="visible">
            <button id="btn-prev-paragraph" title="Párrafo anterior (Shift+←)">⏪</button>
            <button id="btn-prev" title="Anterior (←)">⏮</button>
            <button id="btn-play" title="Reproducir / Pausar (Espacio)">▶</button>
            <button id="btn-next" title="Siguiente (→)">⏭</button>
            <button id="btn-next-paragraph" title="Párrafo siguiente (Shift+→)">⏩</button>
            <div id="wpm-control">
              <button id="btn-wpm-down" title="Bajar velocidad (↓)">−</button>
              <span id="wpm-value">300</span><span class="wpm-label">wpm</span>
              <button id="btn-wpm-up" title="Subir velocidad (↑)">+</button>
            </div>
            <span id="timer-display" title="Tiempo estimado restante">00:00:00</span>
            <button id="btn-toggle-panel" title="Mostrar/ocultar texto completo (T)">📄</button>
            <button id="btn-settings" title="Configuración">⚙</button>
            <button id="btn-toggle-controls" title="Ocultar controles">▾</button>
          </div>
          <button id="btn-show-controls" title="Mostrar controles">▴</button>
        </div>

        <div id="text-panel">
          <div id="panel-tabs">
            <button class="panel-tab-btn active" data-panel-tab="text">Texto</button>
            <button class="panel-tab-btn" data-panel-tab="new">Nuevo</button>
            <button class="panel-tab-btn" data-panel-tab="library">Biblioteca</button>
            <button class="panel-tab-btn" data-panel-tab="history">Historial</button>
          </div>

          <div id="panel-tab-text" class="panel-tab-content active">
            <div id="text-panel-content"></div>
          </div>

          <div id="panel-tab-new" class="panel-tab-content">
            <div id="panel-dropzone">
              <p id="panel-dropzone-label">Arrastrá un archivo .txt, .pdf, .docx o .epub, o pegá texto abajo</p>
              <textarea id="panel-text-input" placeholder="Pegá o escribí el texto a leer…"></textarea>
              <p id="panel-file-status"></p>
              <div class="panel-actions">
                <label class="checkbox-inline">
                  <input type="checkbox" id="panel-save-to-library" />
                  Guardar
                </label>
                <button id="panel-btn-read">Leer</button>
              </div>
            </div>
          </div>

          <div id="panel-tab-library" class="panel-tab-content">
            <p id="panel-library-empty" class="empty-hint">Todavía no guardaste nada en tu biblioteca.</p>
            <ul id="panel-library-list" class="item-list"></ul>
          </div>

          <div id="panel-tab-history" class="panel-tab-content">
            <div class="list-header">
              <button id="panel-btn-clear-history">Vaciar historial</button>
            </div>
            <p id="panel-history-empty" class="empty-hint">Todavía no leíste nada.</p>
            <ul id="panel-history-list" class="item-list"></ul>
          </div>
        </div>
      </div>
    </div>
    <script src="./reader.js"></script>
  </body>
</html>
