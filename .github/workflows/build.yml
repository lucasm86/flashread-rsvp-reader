name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build core + desktop
        run: npm run build

      - name: Package Windows artifacts
        # electron-builder auto-publishes when it detects CI=true (set by GitHub
        # Actions) if a `publish` config exists, which it does now (for
        # electron-updater). This workflow only verifies the build compiles from
        # source — it must never publish, so override explicitly.
        run: npm run dist:win -- --publish never
        working-directory: packages/desktop

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flashread-windows
          path: packages/desktop/release/*.exe
          if-no-files-found: error
